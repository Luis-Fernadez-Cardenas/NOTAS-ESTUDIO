<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuestionario — Proyectos de Inversión</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1e2631;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #7ee787;
      --danger: #f85149;
      --warning: #d29922;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #0d1117 0%, #1a2744 50%, #0d2137 100%);
      padding: 60px 24px 50px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(88,166,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(88,166,255,0.1);
      border: 1px solid rgba(88,166,255,0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(135deg, #e6edf3, #58a6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto 30px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── PROGRESS ── */
    .progress-bar-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,17,23,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 600;
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #58a6ff, #7ee787);
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      min-width: 36px;
      text-align: right;
    }

    /* ── MAIN LAYOUT ── */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── BLOCK HEADER ── */
    .block-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 48px 0 24px;
    }
    .block-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .block-dot.blue   { background: rgba(88,166,255,0.15); border: 2px solid rgba(88,166,255,0.4); }
    .block-dot.green  { background: rgba(126,231,135,0.15); border: 2px solid rgba(126,231,135,0.4); }
    .block-dot.yellow { background: rgba(210,153,34,0.15); border: 2px solid rgba(210,153,34,0.4); }
    .block-dot.orange { background: rgba(255,140,0,0.15); border: 2px solid rgba(255,140,0,0.4); }
    .block-dot.red    { background: rgba(248,81,73,0.15); border: 2px solid rgba(248,81,73,0.4); }
    .block-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .block-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── QUESTION CARD ── */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 16px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .q-card:hover {
      border-color: rgba(88,166,255,0.25);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .q-card.answered-correct {
      border-color: rgba(126,231,135,0.5);
      background: linear-gradient(135deg, var(--surface), rgba(126,231,135,0.04));
    }
    .q-card.answered-wrong {
      border-color: rgba(248,81,73,0.5);
      background: linear-gradient(135deg, var(--surface), rgba(248,81,73,0.04));
    }

    .q-number {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }
    .q-text strong {
      color: var(--accent);
    }

    /* ── OPTIONS ── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .option:hover:not(.disabled) {
      border-color: rgba(88,166,255,0.4);
      background: rgba(88,166,255,0.06);
      transform: translateX(3px);
    }
    .option.selected {
      border-color: var(--accent);
      background: rgba(88,166,255,0.1);
    }
    .option.correct {
      border-color: var(--accent2);
      background: rgba(126,231,135,0.1);
    }
    .option.wrong {
      border-color: var(--danger);
      background: rgba(248,81,73,0.1);
    }
    .option.disabled {
      cursor: default;
    }
    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .option.selected .opt-letter { background: var(--accent); color: #0d1117; }
    .option.correct .opt-letter  { background: var(--accent2); color: #0d1117; }
    .option.wrong .opt-letter    { background: var(--danger); color: white; }
    .opt-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      padding-top: 2px;
    }

    /* ── FEEDBACK ── */
    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.55;
      display: none;
    }
    .feedback.show { display: block; animation: fadeIn 0.3s ease; }
    .feedback.correct-fb {
      background: rgba(126,231,135,0.08);
      border: 1px solid rgba(126,231,135,0.3);
      color: #7ee787;
    }
    .feedback.wrong-fb {
      background: rgba(248,81,73,0.08);
      border: 1px solid rgba(248,81,73,0.3);
      color: #ffa0a0;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SUBMIT BUTTON ── */
    .submit-wrap {
      text-align: center;
      margin-top: 60px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .submit-wrap h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .submit-wrap p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn-submit {
      background: linear-gradient(135deg, #58a6ff, #7ee787);
      color: #0d1117;
      border: none;
      padding: 16px 48px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.5px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(88,166,255,0.3);
    }
    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .unanswered-note {
      margin-top: 12px;
      font-size: 13px;
      color: var(--warning);
      display: none;
    }

    /* ── RESULTS PANEL ── */
    .results-panel {
      display: none;
      margin-top: 48px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    .results-panel.show { display: block; }
    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(var(--accent2) var(--pct, 0%), var(--surface2) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .score-circle::before {
      content: '';
      position: absolute;
      inset: 12px;
      background: var(--surface);
      border-radius: 50%;
    }
    .score-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .score-num { font-size: 36px; font-weight: 800; color: var(--text); }
    .score-den { font-size: 16px; color: var(--text-muted); }
    .score-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .score-msg { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
    .score-breakdown {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .sb-item { text-align: center; }
    .sb-num { font-size: 28px; font-weight: 800; }
    .sb-num.c { color: var(--accent2); }
    .sb-num.w { color: var(--danger); }
    .sb-num.s { color: var(--accent); }
    .sb-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .btn-retry {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      padding: 12px 36px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-retry:hover {
      background: rgba(88,166,255,0.1);
      transform: translateY(-2px);
    }

    /* ── ANSWER KEY ── */
    .answer-key {
      display: none;
      margin-top: 32px;
    }
    .answer-key.show { display: block; }
    .ak-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: var(--text);
    }
    .ak-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .ak-item:hover { border-color: rgba(88,166,255,0.25); }
    .ak-q {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .ak-num {
      background: var(--surface2);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .ak-question { font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .ak-answer {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(126,231,135,0.06);
      border: 1px solid rgba(126,231,135,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .ak-check { color: var(--accent2); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .ak-answer-text { font-size: 14px; font-weight: 600; color: var(--accent2); }
    .ak-why {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      padding-left: 4px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero { padding: 40px 16px 36px; }
      .container { padding: 24px 16px 60px; }
      .q-card { padding: 20px; }
      .stats { gap: 20px; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-badge">📚 Examen de práctica</div>
  <h1>Proyectos de Inversión</h1>
  <p>Cuestionario de 40 preguntas de opción múltiple basado en tus sesiones de clase</p>
  <div class="stats">
    <div class="stat"><div class="stat-num">40</div><div class="stat-label">Preguntas</div></div>
    <div class="stat"><div class="stat-num">5</div><div class="stat-label">Bloques</div></div>
    <div class="stat"><div class="stat-num" id="hero-score">–</div><div class="stat-label">Tu puntaje</div></div>
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-bar-wrap">
  <span class="progress-label">Progreso</span>
  <div class="progress-track"><div class="progress-fill" id="pbar"></div></div>
  <span class="progress-pct" id="ppct">0%</span>
</div>

<div class="container" id="app"></div>

<script>
const questions = [
  // BLOQUE 1 — Conceptos Fundamentales
  {
    block: 0,
    text: '¿Cuál es la definición correcta de un <strong>Proyecto de Inversión</strong>?',
    options: [
      'Es el desembolso de dinero para obtener ganancias a corto plazo',
      'Es la formalización de una idea de negocio que tiene como objetivo encontrar una solución inteligente a un planteamiento de problema',
      'Es un documento legal requerido por el gobierno para iniciar una empresa',
      'Es el estudio financiero de una organización existente'
    ],
    answer: 1,
    why: 'Según los apuntes, el Proyecto de Inversión se define como la formalización de una idea de negocio cuyo objetivo es encontrar una solución inteligente a un planteamiento de problema. No se limita solo al aspecto económico ni a trámites legales.'
  },
  {
    block: 0,
    text: '¿Qué es la <strong>Inversión</strong> según los apuntes del curso?',
    options: [
      'La ganancia obtenida de un negocio exitoso',
      'El conjunto de acciones para mejorar una empresa',
      'La salida o desembolso de dinero con el fin de obtener beneficios ya sea a largo o corto plazo',
      'El análisis del mercado objetivo de un producto'
    ],
    answer: 2,
    why: 'La Inversión se define específicamente como la salida o desembolso de dinero orientado a obtener beneficios futuros. El término clave es "desembolso", que implica un egreso monetario actual con expectativa de retorno.'
  },
  {
    block: 0,
    text: 'Un <strong>proyecto</strong> se define como:',
    options: [
      'Un plan financiero para conseguir financiamiento bancario',
      'Una solución inteligente a un planteamiento de problema tendiente a resolver',
      'Un documento de evaluación de proveedores',
      'Un estudio de rentabilidad exclusivamente'
    ],
    answer: 1,
    why: 'El proyecto, en su definición básica, es una solución inteligente a un planteamiento de problema. Esto lo distingue de simples planes financieros o documentos administrativos.'
  },
  {
    block: 0,
    text: 'Según la memotecnia <strong>IFEER</strong>, ¿cuáles son los pasos del Proyecto de Inversión?',
    options: [
      'Idea, Formulación, Estudio, Evaluación, Resultados',
      'Identificación, Definición-Selección, Formulación, Evaluación, Evaluación de Resultados',
      'Inversión, Financiamiento, Ejecución, Evaluación, Rentabilidad',
      'Idea, Factibilidad, Ejecución, Estadística, Revisión'
    ],
    answer: 1,
    why: 'La memotecnia IFEER representa: Identificación, Formulación (Definición y Selección), Evaluación, Ejecución y Evaluación de Resultados. Cada letra corresponde al paso inicial de cada etapa.'
  },
  {
    block: 0,
    text: '¿Cuál es la memotecnia correcta para recordar el <strong>Ciclo de Vida</strong> de un proyecto?',
    options: ['IFEER', 'PIIOEVA', 'PRIMER', 'PREVAL'],
    answer: 1,
    why: 'PIIOEVA es la memotecnia del Ciclo de Vida: Pre inversión, Inversión, Operación, Evaluación de Resultados. IFEER corresponde a los Pasos del Proyecto de Inversión, son conceptos distintos.'
  },
  {
    block: 0,
    text: 'El ciclo de vida de un proyecto inicia con:',
    options: [
      'La formulación del presupuesto',
      'La aprobación del financiamiento',
      'Un problema originado de una necesidad',
      'La selección del equipo de trabajo'
    ],
    answer: 2,
    why: 'Textualmente en los apuntes: "El ciclo de vida de un proyecto inicia con un problema originado de una necesidad." Esto refleja el enfoque de los proyectos sociales y de inversión que parten de identificar una problemática real.'
  },
  {
    block: 0,
    text: '¿Cuál de las siguientes afirmaciones sobre los efectos de un proyecto es <strong>correcta</strong>?',
    options: [
      'Un proyecto solo tiene efectos directos en la población',
      'El estado monetario del proyecto no influye en los beneficiarios',
      'El proyecto puede tener distintos efectos ya sean directos e indirectos en la población beneficiaria',
      'Los proyectos de inversión no generan efectos secundarios'
    ],
    answer: 2,
    why: 'Los proyectos generan efectos directos e indirectos. Además, no considerar el estado monetario del proyecto es pernicioso, ya que afecta el estado de ánimo de los beneficiarios. Los efectos van más allá de lo inmediato y visible.'
  },
  {
    block: 0,
    text: '¿Cuál es la tarea más importante en la evaluación de un proyecto de inversión?',
    options: [
      'Calcular las ganancias esperadas',
      'Realizar el análisis de si es viable su implementación y desarrollo',
      'Conseguir inversores externos',
      'Publicar el proyecto en medios oficiales'
    ],
    answer: 1,
    why: 'Los apuntes señalan que es "necesario o tarea importante del proyecto realizar el análisis de que si es viable su implementación y desarrollo". La viabilidad es el análisis central de cualquier proyecto de inversión.'
  },
  {
    block: 0,
    text: 'Según la clasificación <strong>"según la finalidad del estudio"</strong>, ¿cuál de las siguientes es una categoría de proyecto?',
    options: [
      'Proyecto de impacto ambiental',
      'Proyecto de capacidad de pago',
      'Proyecto de inclusión social',
      'Proyecto de diversificación'
    ],
    answer: 1,
    why: 'Según la finalidad del estudio, los proyectos se clasifican en: Rentabilidad del proyecto, Rentabilidad de la inversión y Capacidad de pago. Las otras opciones no corresponden a esta clasificación.'
  },
  {
    block: 0,
    text: 'Según su <strong>objeto de inversión</strong>, los proyectos pueden ser de:',
    options: [
      'Rentabilidad o de eficiencia',
      'Creación de un nuevo negocio o proyecto de modernización',
      'Corto o largo plazo',
      'Públicos o privados'
    ],
    answer: 1,
    why: 'La clasificación "según su objeto de inversión" distingue entre proyectos de creación de un nuevo negocio y proyectos de modernización. Estas son las dos subcategorías explícitas en los apuntes.'
  },

  // BLOQUE 2 — Tipos y Ciclo de Vida
  {
    block: 1,
    text: '¿Cuáles son los tres tipos de proyectos de inversión según su <strong>relación entre sí</strong>?',
    options: [
      'Lucrativos, no lucrativos y mixtos',
      'Dependientes, independientes y excluyentes',
      'Públicos, privados y mixtos',
      'Corto, mediano y largo plazo'
    ],
    answer: 1,
    why: 'Los apuntes listan explícitamente tres tipos según la relación entre proyectos: Dependientes, Independientes y Excluyentes. Esta clasificación indica si los proyectos pueden coexistir, se excluyen mutuamente, o uno depende del otro.'
  },
  {
    block: 1,
    text: '¿Cuál es el <strong>objetivo principal</strong> de los proyectos de inversión?',
    options: [
      'Maximizar las ganancias del inversionista',
      'Aprovechar los recursos para mejorar las condiciones de vida de una comunidad',
      'Reducir los costos operativos de una empresa',
      'Incrementar el empleo en el sector privado'
    ],
    answer: 1,
    why: 'El objetivo de los proyectos de inversión, según los apuntes, es "aprovechar los recursos para mejorar las condiciones de vida de una comunidad". Esto refleja un enfoque social y no meramente lucrativo.'
  },
  {
    block: 1,
    text: '¿En qué etapa del ciclo de vida se <strong>identifica el problema</strong> y se generan alternativas de solución?',
    options: ['Etapa de perfil', 'Etapa de inversión', 'Etapa de idea', 'Etapa de operación'],
    answer: 2,

const blocks = [
  { label: 'Bloque 1', title: 'Conceptos Fundamentales', emoji: '🔵', cls: 'blue', range: '1–10' },
  { label: 'Bloque 2', title: 'Tipos de Proyectos y Ciclo de Vida', emoji: '🟢', cls: 'green', range: '11–18' },
  { label: 'Bloque 3', title: 'Formulación del Proyecto y Análisis de Entorno', emoji: '🟡', cls: 'yellow', range: '19–26' },
  { label: 'Bloque 4', title: 'Análisis de Demanda, Oferta y Competitividad', emoji: '🟠', cls: 'orange', range: '27–34' },
  { label: 'Bloque 5', title: 'Segmentación del Mercado y Temas Integradores', emoji: '🔴', cls: 'red', range: '35–40' }
];

const userAnswers = new Array(questions.length).fill(null);
let submitted = false;

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ppct').textContent = pct + '%';
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  let currentBlock = -1;

  questions.forEach((q, qi) => {
    if (q.block !== currentBlock) {
      currentBlock = q.block;
      const b = blocks[currentBlock];
      html += `
        <div class="block-header">
          <div class="block-dot ${b.cls}">${b.emoji}</div>
          <div class="block-info">
            <h2>${b.label} — ${b.title}</h2>
            <p>Preguntas ${b.range}</p>
          </div>
        </div>`;
    }

    const ua = userAnswers[qi];
    let cardClass = '';
    if (submitted && ua !== null) {
      cardClass = ua === q.answer ? 'answered-correct' : 'answered-wrong';
    }

    html += `<div class="q-card ${cardClass}" id="qcard-${qi}">
      <div class="q-number">Pregunta ${qi + 1} de ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts-${qi}">`;

    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, oi) => {
      let cls = '';
      if (ua === oi) cls = 'selected';
      if (submitted) {
        if (oi === q.answer) cls = 'correct';
        else if (ua === oi) cls = 'wrong';
        cls += ' disabled';
      }
      html += `
        <div class="option ${cls}" onclick="selectOption(${qi},${oi})" id="opt-${qi}-${oi}">
          <div class="opt-letter">${letters[oi]}</div>
          <div class="opt-text">${opt}</div>
        </div>`;
    });

    html += `</div>`;

    if (submitted && ua !== null) {
      const isCorrect = ua === q.answer;
      html += `<div class="feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'} show">
        <div class="feedback-title">${isCorrect ? '✅ ¡Correcto!' : '❌ Incorrecto'}</div>
        ${!isCorrect ? `<strong>Respuesta correcta:</strong> ${letters[q.answer]}) ${q.options[q.answer]}<br><br>` : ''}
        <strong>Explicación:</strong> ${q.why}
      </div>`;
    }

    html += `</div>`;
  });

  // Submit section
  const unanswered = userAnswers.filter(a => a === null).length;
  html += `
    <div class="submit-wrap" id="submit-wrap">
      ${!submitted ? `
        <h3>¿Listo para ver tus resultados?</h3>
        <p>Has respondido <strong>${questions.length - unanswered}</strong> de <strong>${questions.length}</strong> preguntas.</p>
        <button class="btn-submit" id="btn-submit" onclick="submitQuiz()">
          Confirmar y ver respuestas
        </button>
        <div class="unanswered-note" id="unans-note">
          ⚠️ Aún tienes ${unanswered} pregunta(s) sin responder. Puedes igualmente enviar.
        </div>
      ` : ''}
    </div>`;

  if (submitted) {
    const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
    const wrong = userAnswers.filter((a, i) => a !== null && a !== questions[i].answer).length;
    const skip = userAnswers.filter(a => a === null).length;
    const pct = Math.round((correct / questions.length) * 100);
    let emoji, msg;
    if (pct >= 90) { emoji = '🏆'; msg = '¡Excelente! Dominas el tema perfectamente.'; }
    else if (pct >= 75) { emoji = '😊'; msg = '¡Muy bien! Tienes un buen manejo del tema.'; }
    else if (pct >= 60) { emoji = '📖'; msg = 'Aprobado, pero repasa los temas donde fallaste.'; }
    else { emoji = '💪'; msg = 'Necesitas reforzar más los conceptos. ¡Tú puedes!'; }

    html += `
      <div class="results-panel show" id="results">
        <div style="font-size:48px;margin-bottom:16px">${emoji}</div>
        <div class="score-circle" style="--pct:${pct * 3.6}deg">
          <div class="score-inner">
            <div class="score-num">${correct}</div>
            <div class="score-den">/ ${questions.length}</div>
          </div>
        </div>
        <div class="score-title">Tu puntaje: ${pct}%</div>
        <div class="score-msg">${msg}</div>
        <div class="score-breakdown">
          <div class="sb-item"><div class="sb-num c">${correct}</div><div class="sb-label">Correctas</div></div>
          <div class="sb-item"><div class="sb-num w">${wrong}</div><div class="sb-label">Incorrectas</div></div>
          <div class="sb-item"><div class="sb-num s">${skip}</div><div class="sb-label">Sin responder</div></div>
        </div>
        <button class="btn-retry" onclick="retryQuiz()">🔄 Intentar de nuevo</button>
      </div>`;

    document.getElementById('hero-score') && (document.getElementById('hero-score').textContent = pct + '%');
  }

  app.innerHTML = html;
  updateProgress();
}

function selectOption(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;

  // Remove selected from all options in question
  document.querySelectorAll(`#opts-${qi} .option`).forEach(el => el.classList.remove('selected'));
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');

  updateProgress();
  updateSubmitUI();
}

function updateSubmitUI() {
  const unanswered = userAnswers.filter(a => a === null).length;
  const note = document.getElementById('unans-note');
  if (note) {
    note.style.display = unanswered > 0 ? 'block' : 'none';
    note.textContent = `⚠️ Aún tienes ${unanswered} pregunta(s) sin responder. Puedes igualmente enviar.`;
  }
  const wrap = document.getElementById('submit-wrap');
  if (wrap) {
    const p = wrap.querySelector('p');
    if (p) p.innerHTML = `Has respondido <strong>${questions.length - unanswered}</strong> de <strong>${questions.length}</strong> preguntas.`;
  }
}

function submitQuiz() {
  submitted = true;
  const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
  document.getElementById('hero-score').textContent = Math.round((correct / questions.length) * 100) + '%';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retryQuiz() {
  submitted = false;
  userAnswers.fill(null);
  document.getElementById('hero-score').textContent = '–';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
